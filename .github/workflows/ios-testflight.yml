name: iOS TestFlight

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ios-testflight.yml
      - ios-native/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_BUNDLE_ID: app.dimo.ios
  ARCHIVE_PATH: ${{ github.workspace }}/build/Dimo.xcarchive
  EXPORT_PATH: ${{ github.workspace }}/build/export
  PROJECT_PATH: ios-native/Dimo.xcodeproj
  SCHEME: Dimo
  SPM_CACHE_PATH: ${{ github.workspace }}/.spm-cache
  TEST_DERIVED_DATA_PATH: ${{ github.workspace }}/.derived-data-tests

jobs:
  test:
    name: Test Dimo
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Select Xcode
        id: xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcode_version="$(xcodebuild -version | awk 'NR == 1 { print $2 }')"
          xcode_build="$(xcodebuild -version | awk 'NR == 2 { print $3 }')"
          echo "cache-key=${xcode_version}-${xcode_build}" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            if brew tap | grep -qx "aws/tap"; then
              brew untap aws/tap
            fi
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        working-directory: ios-native
        run: xcodegen generate

      - name: Restore Swift package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SPM_CACHE_PATH }}
          key: spm-${{ runner.os }}-${{ runner.arch }}-test-${{ hashFiles('ios-native/project.yml') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-test-
            spm-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore test build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.TEST_DERIVED_DATA_PATH }}/Build
            ${{ env.TEST_DERIVED_DATA_PATH }}/ModuleCache.noindex
          key: test-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.cache-key }}-${{ hashFiles('ios-native/project.yml', 'ios-native/Config/*.xcconfig', 'ios-native/Dimo/**/*.swift', 'ios-native/DimoTests/**/*.swift', 'ios-native/Dimo/Resources/**') }}
          restore-keys: |
            test-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.cache-key }}-

      - name: Run iOS tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=iPhone 17,OS=latest" \
            -clonedSourcePackagesDirPath "$SPM_CACHE_PATH" \
            -derivedDataPath "$TEST_DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=arm64 \
            | xcbeautify

  archive:
    name: Archive Dimo
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Verify deployment configuration
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPSTORE_CERTIFICATES_FILE_BASE64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          APPSTORE_CERTIFICATES_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            APPLE_TEAM_ID \
            APPSTORE_ISSUER_ID \
            APPSTORE_API_KEY_ID \
            APPSTORE_API_PRIVATE_KEY \
            APPSTORE_CERTIFICATES_FILE_BASE64 \
            APPSTORE_CERTIFICATES_PASSWORD
          do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "Missing GitHub Actions configuration: ${missing[*]}" >&2
            echo "Follow the one-time setup in store/SUBMIT.md." >&2
            exit 1
          fi

      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            if brew tap | grep -qx "aws/tap"; then
              brew untap aws/tap
            fi
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        working-directory: ios-native
        run: xcodegen generate

      - name: Restore Swift package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SPM_CACHE_PATH }}
          key: spm-${{ runner.os }}-${{ runner.arch }}-archive-${{ hashFiles('ios-native/project.yml') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-archive-
            spm-${{ runner.os }}-${{ runner.arch }}-

      - name: Import Apple distribution certificate
        uses: apple-actions/import-codesign-certs@7abe6dfe88f6bf6b1fa06e6a5704a2605d897418 # v7
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: Download App Store provisioning profile
        uses: apple-actions/download-provisioning-profiles@2126b5f86a0e2863cbf4d2d312112b22b943a594 # v6.1.0
        with:
          bundle-id: ${{ env.APP_BUNDLE_ID }}
          profile-type: IOS_APP_STORE
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Set unique build number
        run: |
          build_number=$((1000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          echo "Building Dimo 1.0.0 ($build_number)"

      - name: Archive signed app
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            -clonedSourcePackagesDirPath "$SPM_CACHE_PATH" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | xcbeautify

      - name: Export IPA
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist ios-native/ExportOptions.plist \
            | xcbeautify
          test -f "$EXPORT_PATH/Dimo.ipa"

      - name: Store IPA for upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Dimo-ipa
          path: ${{ env.EXPORT_PATH }}/Dimo.ipa
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  upload:
    name: Upload Dimo to TestFlight
    needs:
      - test
      - archive
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download signed IPA
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Dimo-ipa
          path: ${{ env.EXPORT_PATH }}

      - name: Verify signed IPA
        run: test -f "$EXPORT_PATH/Dimo.ipa"

      - name: Upload to TestFlight
        # Fork of v5.2.1 with info-level, fixed 30-second processing retries.
        uses: saitejasegu/upload-testflight-build@b58d0d9a7fa738fd4a1040574993c00ac588283c
        with:
          app-path: ${{ env.EXPORT_PATH }}/Dimo.ipa
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          release-notes: Commit ${{ github.sha }}
          wait-for-processing: "true"
