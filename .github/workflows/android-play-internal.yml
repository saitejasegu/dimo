name: Android Play Internal

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/android-play-internal.yml
      - android-native/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-play-internal-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  PACKAGE_NAME: app.dimo.android

jobs:
  test:
    name: Test Dimo Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK
        uses: actions/setup-java@f2beeb24e81205c732202ba85f1b5fac21764264 # v5.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3fc1e95aa09 # v5.0.0

      - name: Run unit tests
        working-directory: android-native
        run: ./gradlew :app:testProdDebugUnitTest --stacktrace

  build:
    name: Build signed prodRelease AAB
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Verify Play upload configuration
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            PLAY_SERVICE_ACCOUNT_JSON \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD
          do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "Missing GitHub Actions configuration: ${missing[*]}" >&2
            echo "Follow the one-time setup in store/ANDROID_PLAY_INTERNAL.md." >&2
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@f2beeb24e81205c732202ba85f1b5fac21764264 # v5.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3fc1e95aa09 # v5.0.0

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          keystore_path="${{ runner.temp }}/dimo-upload.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Set unique build number
        run: |
          build_number=$((1000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          echo "Building Dimo Android 1.0.0 ($build_number)"

      - name: Bundle signed prodRelease AAB
        working-directory: android-native
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:bundleProdRelease \
            -PversionCode="$BUILD_NUMBER" \
            -PversionName="1.0.0+$BUILD_NUMBER" \
            --stacktrace
          test -f app/build/outputs/bundle/prodRelease/app-prod-release.aab

      - name: Store AAB for upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Dimo-android-aab
          path: android-native/app/build/outputs/bundle/prodRelease/app-prod-release.aab
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  upload:
    name: Upload to Play Internal testing
    needs:
      - test
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download AAB
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Dimo-android-aab
          path: dist

      - name: Verify AAB
        run: test -f dist/app-prod-release.aab

      - name: Upload to Google Play Internal testing
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: dist/app-prod-release.aab
          tracks: internal
          status: completed
          changesNotSentForReview: true
          releaseName: ${{ github.sha }}
