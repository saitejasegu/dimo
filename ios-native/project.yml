name: Dimo
options:
  bundleIdPrefix: app.dimo
  # Sets LastUpgradeCheck so Xcode stops raising "Update to recommended settings".
  xcodeVersion: "26.6"
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release
  # Separate "Dimo Dev" app on the Convex dev deployment (Config/Dev.xcconfig).
  Dev: debug

settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    # Xcode 26 recommended settings. XcodeGen's own defaults still ship the
    # Xcode 14 values, so pin the current ones here.
    ENABLE_USER_SCRIPT_SANDBOXING: true
    GCC_C_LANGUAGE_STANDARD: gnu17
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"
    LOCALIZATION_PREFERS_STRING_CATALOGS: true
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: true
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Dev:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG DIMO_DEV
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

packages:
  ConvexMobile:
    url: https://github.com/get-convex/convex-swift
    from: "0.2.0"
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"

targets:
  Dimo:
    type: application
    platform: iOS
    sources:
      - path: WidgetShared
      - path: Dimo
        excludes:
          - Resources/Info.plist
          - Resources/**
      - path: Dimo/Resources
        buildPhase: resources
        excludes:
          - "**/*.swift"
          - Info.plist
      - path: Dimo/Resources/Info.plist
        buildPhase: none
        type: file
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Dimo/Dimo.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: $(DIMO_BUNDLE_ID)
        PRODUCT_NAME: Dimo
        INFOPLIST_FILE: Dimo/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: $(DIMO_APP_ICON)
        CODE_SIGN_STYLE: Automatic
        # DEVELOPMENT_TEAM comes from Config/Secrets.xcconfig (gitignored).
        CURRENT_PROJECT_VERSION: 3
        MARKETING_VERSION: 1.0.0
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Dev:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Dimo App Store CI
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
      Dev: Config/Dev.xcconfig
    dependencies:
      - target: DimoWidgets
        embed: true
      - package: ConvexMobile
      - package: GRDB
        product: GRDB
    scheme:
      testTargets:
        - DimoTests

  DimoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: DimoWidgets
        excludes: [Info.plist, DimoWidgets.entitlements]
      - path: WidgetShared
      - path: Dimo/DesignSystem/Theme.swift
      - path: Dimo/DesignSystem/Fonts.swift
      - path: Dimo/Resources/Fonts
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DIMO_BUNDLE_ID).widgets
        PRODUCT_NAME: DimoWidgets
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DIMO_WIDGET"
        INFOPLIST_FILE: DimoWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: DimoWidgets/DimoWidgets.entitlements
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 3
        MARKETING_VERSION: 1.0.0
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Dimo Widgets App Store CI
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
      Dev: Config/Dev.xcconfig

  DimoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DimoTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dimo.ios.tests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_STYLE: Automatic
        # DEVELOPMENT_TEAM comes from Config/Secrets.xcconfig (gitignored).
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Dimo.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Dimo"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: Dimo
      - package: GRDB
        product: GRDB
    scheme: {}

schemes:
  # Builds the separate "Dimo Dev" app (app.dimo.ios.dev) against the Convex
  # dev deployment; it installs beside the production app.
  Dimo Dev:
    build:
      targets:
        Dimo: all
    run:
      config: Dev
    test:
      config: Dev
    profile:
      config: Dev
    analyze:
      config: Dev
    archive:
      config: Dev
